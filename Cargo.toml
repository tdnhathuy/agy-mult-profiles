[package]
name = "agyp"
version = "0.3.0"
edition = "2021"
description = "Antigravity Multi-Profile CLI Manager for Developers and AI Agents"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23.1"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
